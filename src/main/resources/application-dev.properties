# ==================================================
# LIBRARY APP — DEVELOPMENT PROFILE (dev)
# ==================================================

spring.application.name=library-backend-dev

# --------------------------------------------------
# DATABASE — H2 (In-Memory)
# --------------------------------------------------
spring.datasource.url=jdbc:h2:mem:libappdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# --------------------------------------------------
# JPA / HIBERNATE (Dev)
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# Initial SQL data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# --------------------------------------------------
# CORS (Permissive)
# --------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,http://10.109.3.52:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Cache-Control,Origin
app.cors.exposed-headers=Authorization,Content-Type,Content-Disposition
app.cors.max-age=3600
app.cors.allow-credentials=true

# --------------------------------------------------
# LOGGING & ERROR HANDLING (Verbose)
# --------------------------------------------------
logging.level.com.libapp.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

server.error.include-message=always
server.error.include-stacktrace=always

# --------------------------------------------------
# DEVTOOLS
# --------------------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
management.endpoints.web.exposure.include=health,info,metrics