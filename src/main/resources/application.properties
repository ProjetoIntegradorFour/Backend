# ============================================
# LIBRARY APP - DEVELOPMENT CONFIGURATION
# ============================================

# Application
spring.application.name=library-backend-dev

# ============================================
# DATABASE - H2 IN-MEMORY (DEVELOPMENT)
# ============================================
spring.datasource.url=jdbc:h2:mem:libappdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (ENABLED FOR DEV)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update  # Changed from create-drop to preserve data
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.defer-datasource-initialization=true

# Load initial data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ============================================
# JWT AUTHENTICATION (DEV KEYS)
# ============================================
jwt.secret=DevelopmentSecretKey123456789012345678901234567890
jwt.expiration=86400000  # 24 hours in milliseconds

# ============================================
# CORS CONFIGURATION (PERMISSIVE FOR DEV)
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,http://10.109.3.52:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Cache-Control,Origin
app.cors.exposed-headers=Authorization,Content-Type,Content-Disposition
app.cors.max-age=3600
app.cors.allow-credentials=true

# ============================================
# EXTERNAL SERVICES
# ============================================
app.external.openlibrary.url=https://openlibrary.org
app.external.openlibrary.timeout=5000  # 5 seconds

# ============================================
# LOGGING (VERBOSE FOR DEV)
# ============================================
logging.level.com.libapp.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/
server.error.include-stacktrace=always
server.error.include-message=always

# ============================================
# SPRING SECURITY (DEVELOPMENT)
# ============================================
spring.security.filter.order=10

# ============================================
# TESTING & DEBUGGING
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
management.endpoints.web.exposure.include=health,info,metrics