# ==================================================
# LIBRARY APP — PRODUCTION/CLOUD CONFIGURATION
# ==================================================

# --------------------------------------------------
# APPLICATION
# --------------------------------------------------
spring.application.name=library-backend-prod


# --------------------------------------------------
# DATABASE — RDS MYSQL (PERSISTENT, CLOUD)
# --------------------------------------------------
spring.datasource.url=${RDS_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${RDS_DB_USER}
spring.datasource.password=${RDS_DB_PASSWORD}


# --------------------------------------------------
# JPA / HIBERNATE
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

# MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never 


# --------------------------------------------------
# JWT AUTHENTICATION
# --------------------------------------------------
jwt.secret=DevelopmentSecretKey123456789012345678901234567890
jwt.expiration.ms=86400000


# --------------------------------------------------
# CORS CONFIGURATION (STRICTER — CLOUD)
# --------------------------------------------------
app.cors.allowed-origins=https://develop.dcpuhecy5auut.amplifyapp.com/,http://localhost:3000,http://localhost:5173,http://localhost:8081,http://10.109.3.52:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Cache-Control,Origin
app.cors.exposed-headers=Authorization,Content-Type,Content-Disposition
app.cors.max-age=3600
app.cors.allow-credentials=true


# --------------------------------------------------
# EXTERNAL SERVICES
# --------------------------------------------------
app.external.openlibrary.url=https://openlibrary.org
app.external.openlibrary.timeout=5000


# --------------------------------------------------
# LOGGING (CLEANER — PROD)
# --------------------------------------------------
logging.level.com.libapp.backend=INFO # INFO is usually sufficient for prod
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN


# --------------------------------------------------
# SERVER
# --------------------------------------------------
server.port=8080
server.servlet.context-path=/
server.error.include-message=never # Less info exposed in prod
server.error.include-stacktrace=never


# --------------------------------------------------
# SPRING SECURITY
# --------------------------------------------------
spring.security.filter.order=10