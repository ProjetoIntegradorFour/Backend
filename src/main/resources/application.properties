# ==================================================
# LIBRARY APP — SINGLE CONFIGURATION (DEV MODE)
# ==================================================

# --------------------------------------------------
# APPLICATION DEFAULTS
# --------------------------------------------------
spring.application.name=library-backend
server.port=8080
server.servlet.context-path=/
spring.security.filter.order=10

# --------------------------------------------------
# DATABASE — H2 (In-Memory)
# --------------------------------------------------
# DB_CLOSE_DELAY=-1 ensures the DB stays alive while the JVM is running
spring.datasource.url=jdbc:h2:mem:libappdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# --------------------------------------------------
# JPA / HIBERNATE
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --------------------------------------------------
# DATA INITIALIZATION (data.sql)
# --------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# --------------------------------------------------
# JWT AUTHENTICATION
# --------------------------------------------------
jwt.secret=DevelopmentSecretKey123456789012345678901234567890
jwt.expiration.ms=86400000

# --------------------------------------------------
# EXTERNAL SERVICES
# --------------------------------------------------
app.external.openlibrary.url=https://openlibrary.org
app.external.openlibrary.timeout=5000

# --------------------------------------------------
# CORS (Permissive for Dev)
# --------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,http://10.109.3.52:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Cache-Control,Origin
app.cors.exposed-headers=Authorization,Content-Type,Content-Disposition
app.cors.max-age=3600
app.cors.allow-credentials=true

# --------------------------------------------------
# LOGGING & ERROR HANDLING
# --------------------------------------------------
logging.level.com.libapp.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG 

server.error.include-message=always
server.error.include-stacktrace=always