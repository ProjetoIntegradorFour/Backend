# ==================================================
# LIBRARY APP — COMMON CONFIGURATION (Shared)
# ==================================================

# --------------------------------------------------
# APPLICATION DEFAULTS
# --------------------------------------------------
spring.application.name=library-backend
server.port=8080
server.servlet.context-path=/
spring.security.filter.order=10

# --------------------------------------------------
# JWT AUTHENTICATION (Shared)
# --------------------------------------------------
# If you ever need a different secret for Prod, override this in application-prod.properties
jwt.secret=DevelopmentSecretKey123456789012345678901234567890
jwt.expiration.ms=86400000

# --------------------------------------------------
# EXTERNAL SERVICES (Shared)
# --------------------------------------------------
app.external.openlibrary.url=https://openlibrary.org
app.external.openlibrary.timeout=5000