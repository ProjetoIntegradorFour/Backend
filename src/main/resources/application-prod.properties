# --------------------------------------------------
# DATABASE — H2 (Replaced RDS MYSQL)
# --------------------------------------------------
spring.datasource.url=jdbc:h2:mem:libappdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --------------------------------------------------
# JPA / HIBERNATE (Updated for H2)
# --------------------------------------------------
# Use 'update' to preserve schema or 'create-drop' for a fresh DB every restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 console if you need to debug in prod (Optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console