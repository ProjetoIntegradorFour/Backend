# ==================================================
# LIBRARY APP — PRODUCTION PROFILE (prod)
# ==================================================

spring.application.name=library-backend-prod

# --------------------------------------------------
# DATABASE — RDS MYSQL
# --------------------------------------------------
spring.datasource.url=${RDS_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${RDS_DB_USER}
spring.datasource.password=${RDS_DB_PASSWORD}

# --------------------------------------------------
# JPA / HIBERNATE (Prod)
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never 

# --------------------------------------------------
# CORS (Strict)
# --------------------------------------------------
app.cors.allowed-origins=https://develop.dcpuhecy5auut.amplifyapp.com/,http://localhost:3000,http://localhost:5173,http://localhost:8081,http://10.109.3.52:8081
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Cache-Control,Origin
app.cors.exposed-headers=Authorization,Content-Type,Content-Disposition
app.cors.max-age=3600
app.cors.allow-credentials=true

# --------------------------------------------------
# LOGGING & ERROR HANDLING (Safe)
# --------------------------------------------------
logging.level.com.libapp.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

server.error.include-message=never
server.error.include-stacktrace=never