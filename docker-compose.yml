version: "3.8"

services:
  backend:
    build: .
    image: backend-backend
    container_name: backend
    ports:
      - "8080:8080"
    environment:
    - SPRING_PROFILES_ACTIVE=prod
    - RDS_DB_URL=jdbc:mysql:/bancodelivros.cxa6mcuagzip.us-east-1.rds.amazonaws.com:3306/prateleira
    - RDS_DB_USER=admin
    - RDS_DB_PASSWORD=camargoreidelas
    restart: unless-stopped

  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
      - ./npm/ssl:/etc/ssl/nginx
